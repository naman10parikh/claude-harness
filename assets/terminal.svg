<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">claude-harness --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: claude-harness [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">One command installs a tested Claude Code harness: skills, hooks, rules,</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">sub-agents and memory.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -V, --version                       output the version number</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help                          display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  init [options] [directory]          Initialize a Claude Code harness in your</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                                      project</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  verify                              Check harness setup is correct</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  memory-search [options] &lt;query...&gt;  Search this repo's own knowledge corpus</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                                      (BM25 over brain/docs/memory/identity)</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  sandbox-run [options]               Run the scaffolder's core action inside an</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                                      isolated E2B sandbox (proves isolation)</text>
</svg>
