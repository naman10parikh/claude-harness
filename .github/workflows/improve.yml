name: improve

# Claude Harness's self-improvement loop (dsip.json). It runs daily and on demand and needs no secret.
# It runs the golden evals, compares them with eval/baseline.json and checks for outdated or
# deprecated dependencies. It tries the in-range updates on this throwaway runner. It writes a
# proposal to the job summary, an artifact and one open issue labelled "proposal". It never changes
# the code, pushes or merges; a person reviews the proposal and merges any change through a pull
# request.

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the improvement loop
        run: pnpm improve
      - name: Show the proposal
        if: always()
        run: cat logs/improve/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: improvement-proposal
          path: logs/improve/
          if-no-files-found: ignore
      - name: Open or update the proposal issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f=logs/improve/latest.md
          if [ ! -s "$f" ]; then echo "No proposal to open."; exit 0; fi
          body="$RUNNER_TEMP/proposal-issue.md"
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            cat "$f"
          } > "$body"
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          n=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "$body"
          else
            gh issue create --title "Claude Harness: proposal from the self-improvement loop" --label proposal --body-file "$body"
          fi
