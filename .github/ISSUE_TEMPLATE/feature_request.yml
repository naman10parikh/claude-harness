name: Feature request
description: Suggest a new skill, hook, rule, or improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: I keep losing context when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Be specific about whether this is a skill, hook, rule, or template.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [New skill, New hook, New rule, Template improvement, CLI improvement, Documentation, Other]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any examples, screenshots, or references.
