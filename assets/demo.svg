<text x="24" y="86" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.58s"></text>
<text x="24" y="106" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.62s">  claude-harness</text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.67s">  One command installs a tested Claude Code harness: skills, hooks, rules, sub-agents and memory.</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.72s"></text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.77s"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.82s">  Installing Pro harness...</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.87s"></text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.92s">  + 5 skills -&gt; .claude/skills/</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:4.97s">  + 6 hooks -&gt; .claude/hooks/</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.02s">  + 3 rules -&gt; .claude/rules/</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.07s"></text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.12s">  Done! Pro harness installed.</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.17s"></text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.22s">  What was installed:</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.27s">     5 skills      .claude/skills/</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.32s">     6 hooks       .claude/hooks/</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.37s">     3 rules       .claude/rules/</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.42s">     1 memory      memory/</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.47s">     2 scripts     scripts/</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.52s"></text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.57s">  Next steps:</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.62s">    1. Edit CLAUDE.md — fill in project details</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.67s">    2. Run  bash scripts/verify.sh — check setup</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.72s">    3. Run  claude — hooks activate automatically</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.77s"></text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve" class="k" style="animation-delay:5.82s">  The harness is the product.</text>
</svg>
